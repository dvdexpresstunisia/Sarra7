    <path d="M-72 -56 Q0 -128 72 -56" fill="none" stroke="#9b8bff" stroke-width="5" stroke-linecap="round"/>
    <path d="M-90 70 Q0 142 90 70" fill="none" stroke="#47dfff" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="-117" cy="-28" r="4" fill="#50eaff"/><circle cx="117" cy="28" r="4" fill="#b58aff"/>
