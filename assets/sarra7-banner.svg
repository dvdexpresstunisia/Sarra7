    <circle cx="24" cy="23" r="5" fill="#3be4ff"/>
    <text x="42" y="29" fill="#d8faff" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">VOICE • AVATAR • TOOLS</text>
  </g>
</g>
<g transform="translate(950 48)">
