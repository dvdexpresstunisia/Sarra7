  <text x="385" y="366" fill="#c3b4ff" font-family="Arial,sans-serif" font-size="12" text-anchor="end" letter-spacing="2">SARRA / SYSTEM</text>
</g>
<text x="90" y="476" fill="#8393b9" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">DESKTOP AI • GEMINI LIVE • LOCAL WORKFLOWS</text>
