<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Sarra7 — voice AI companion</title>
<desc id="desc">A dark futuristic interface with cyan and violet light, a central abstract holographic avatar, voice waveform and desktop assistant panels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1b"/><stop offset=".55" stop-color="#101b38"/><stop offset="1" stop-color="#090d20"/></linearGradient>
  <radialGradient id="glowC"><stop stop-color="#2ce4ff" stop-opacity=".34"/><stop offset="1" stop-color="#2ce4ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowV"><stop stop-color="#9c6bff" stop-opacity=".32"/><stop offset="1" stop-color="#9c6bff" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#39e8ff"/><stop offset="1" stop-color="#8d73ff"/></linearGradient>
  <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b3f6ff" stop-opacity=".9"/><stop offset="1" stop-color="#a58aff" stop-opacity=".62"/></linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8ac8ff" stroke-opacity=".075" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1600" height="520" rx="28" fill="url(#bg)"/>
<rect width="1600" height="520" rx="28" fill="url(#grid)"/>
<circle cx="760" cy="260" r="330" fill="url(#glowC)" filter="url(#blur)"/>
<circle cx="1200" cy="210" r="300" fill="url(#glowV)" filter="url(#blur)"/>
<g opacity=".6" fill="none" stroke="url(#line)">
  <path d="M0 420 C240 360 330 480 560 405 S930 345 1120 400 S1430 460 1600 350" stroke-width="2"/>
  <path d="M0 444 C240 384 330 504 560 429 S930 369 1120 424 S1430 484 1600 374" stroke-width="1"/>
</g>
<g transform="translate(90 112)">
  <text x="0" y="0" fill="#65eaff" font-family="Arial,sans-serif" font-size="19" letter-spacing="6" font-weight="700">PERSONAL AI COMPANION</text>
  <text x="0" y="100" fill="#f3f7ff" font-family="Arial,sans-serif" font-size="92" font-weight="700" letter-spacing="-3">SARRA7</text>
  <text x="4" y="151" fill="#c7d5f7" font-family="Arial,sans-serif" font-size="28">A voice-first assistant for your desktop.</text>
  <g transform="translate(4 212)">
