<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sarra — Avatar Mark-LV</title>
  <style>
    /* Fond transparent : le HUD PyQt6 peint derrière la vue WebEngine. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #scene { position: fixed; inset: 0; }
    #chargement {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9fd8ff; font-family: Consolas, monospace; font-size: 13px;
      background: transparent; pointer-events: none;
    }
    #debug-sarra {
      position: fixed; top: 8px; left: 8px; z-index: 9999;
      padding: 5px 7px; color: #00ff88; background: rgba(0, 0, 0, 0.72);
      font-family: Consolas, monospace; font-size: 12px;
      pointer-events: none; white-space: pre-wrap;
    }
    #avatar-tools {
      position: fixed; right: 10px; top: 10px; z-index: 10002;
      color: #bdeaff; background: rgba(0, 8, 16, 0.92);
      border: 1px solid #08708c; padding: 8px; width: 210px;
      font: 11px Consolas, monospace; display: none;
    }
    #avatar-tools.open { display: block; }
    /* Micro HTML : au-dessus du canvas Three.js et du masque. Un bouton
       natif Qt serait peint sous le QWebEngineView, jamais au-dessus. */
    #avatar-mic-toggle {
      /* Décalé de 2 cm vers le bas depuis la position initiale. */
      position: fixed; bottom: calc(10px + 1cm); left: 50%; transform: translateX(-50%);
      z-index: 10001; width: 52px; height: 52px; border-radius: 26px;
      display: flex; align-items: center; justify-content: center;
      padding: 0; cursor: pointer; font-size: 22px; line-height: 1;
      font-family: "Segoe UI Emoji", "Segoe UI", sans-serif;
      color: #00ff88; background: rgba(0, 24, 12, 0.92);
      border: 2px solid #00ff88; box-shadow: 0 0 12px rgba(0, 255, 136, 0.25);
    }
    #avatar-mic-toggle:hover {
      background: rgba(0, 46, 56, 0.95); border-color: #fff;
    }
    #avatar-mic-toggle.muted {
      color: #ff4d6d; background: rgba(28, 0, 10, 0.92);
      border-color: #ff4d6d; box-shadow: 0 0 12px rgba(255, 77, 109, 0.25);
    }
    body.calibration #avatar-mic-toggle { display: none !important; }
    /* En avatar flottant, seuls les contrôles de diagnostic et de sélection
       restent masqués. Le panneau de réglage n'a plus de bouton dédié. */
    body.avatar-only #avatar-select-toggle,
    body.avatar-only #debug-sarra,
    body.avatar-only #chargement { display: none !important; }
    body.calibration #avatar-tools,
    body.calibration #avatar-select-toggle,
    body.calibration #debug-sarra,
    body.calibration #chargement { display: none !important; }
    #avatar-tools h3 { margin: 0 0 7px; color: #00d4ff; font-size: 12px; }
    #avatar-tools label { display: flex; justify-content: space-between; margin: 4px 0; gap: 8px; }
    #avatar-tools input { width: 78px; box-sizing: border-box; color: #d9f7ff; background: #00131d; border: 1px solid #07536a; font: inherit; }
    #avatar-tools button, #avatar-select-toggle { color: #00eaff; background: #00131d; border: 1px solid #08708c; cursor: pointer; font: 11px Consolas, monospace; }
    #avatar-select-toggle { position: fixed; right: 10px; bottom: 42px; z-index: 10000; padding: 5px 8px; }
    #avatar-tools button { padding: 4px 6px; margin: 5px 2px 0 0; }
    #avatar-config-status { color: #72ffb0; min-height: 14px; margin-top: 4px; }
  </style>
  <!-- Version figée de Three.js : évite les régressions du CDN. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.0.7/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>
  <button id="avatar-mic-toggle" type="button" aria-label="Micro"
          aria-pressed="false" title="Micro actif — cliquer pour couper">🎙</button>
  <div id="chargement">Chargement de Sarra…</div>
  <div id="debug-sarra">En attente de données...</div>
  <button id="avatar-select-toggle" type="button">AVATAR</button>
  <section id="avatar-tools" aria-label="Réglage avatar et caméra">
    <h3>CADRAGE AVATAR</h3>
    <label>Modèle <select id="avatar-model" style="width: 118px; color: #d9f7ff; background: #00131d; border: 1px solid #07536a; font: inherit;"></select></label>
    <label>Échelle <input id="avatar-scale" type="number" min="0.1" max="30" step="0.1"></label>
    <label>Position X <input id="avatar-x" type="number" step="0.05"></label>
    <label>Position Y <input id="avatar-y" type="number" step="0.05"></label>
    <label>Position Z <input id="avatar-z" type="number" step="0.05"></label>
    <label>Rotation Y° <input id="avatar-ry" type="number" step="1"></label>
    <label>Caméra X <input id="camera-x" type="number" step="0.05"></label>
    <label>Caméra Y <input id="camera-y" type="number" step="0.05"></label>
    <label>Caméra Z <input id="camera-z" type="number" min="0.2" max="100" step="0.05"></label>
    <label>Cible Y <input id="camera-target-y" type="number" step="0.05"></label>
    <h3>MASQUE</h3>
    <label>Forme <select id="mask-shape" style="width: 118px; color: #d9f7ff; background: #00131d; border: 1px solid #07536a; font: inherit;">
      <option value="none">Aucun</option>
      <option value="circle">Cercle</option>
      <option value="ellipse">Ovale</option>
    </select></label>
    <label title="Cercle : diamètre. Ovale : largeur.">Taille % <input id="mask-size" type="number" min="10" max="100" step="1"></label>
    <label title="Uniquement pour l'ovale.">Hauteur % <input id="mask-height" type="number" min="10" max="100" step="1"></label>
    <label>Pos. X % <input id="mask-x" type="number" min="0" max="100" step="1"></label>
    <label>Pos. Y % <input id="mask-y" type="number" min="0" max="100" step="1"></label>
    <button id="mask-head" type="button"
            title="Cadre la tête en ovale (ou en cercle si la forme Cercle est choisie)">TÊTE SEULE</button>
    <button id="avatar-auto-frame" type="button">AUTO-CADRER LE VISAGE</button>
    <button id="avatar-save" type="button">SAUVEGARDER</button>
    <button id="avatar-reset" type="button">RÉINITIALISER</button>
    <div id="avatar-config-status"></div>
  </section>
  <script src="./qwebchannel.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
